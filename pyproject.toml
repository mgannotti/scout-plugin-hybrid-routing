[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scout-plugin-hybrid-routing"
version = "1.3.0"
description = "Hybrid contextual inference routing for Microsoft Scout — route tasks across cloud, on-device and org-hosted models with an enforced egress boundary."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Michael Gannotti" }]
keywords = [
    "microsoft-scout",
    "model-routing",
    "hybrid-inference",
    "local-llm",
    "ollama",
    "foundry-local",
    "privacy",
    "egress",
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/mgannotti/scout-plugin-hybrid-routing"
Issues = "https://github.com/mgannotti/scout-plugin-hybrid-routing/issues"
"Upstream (Hermes)" = "https://github.com/smfworks/hermes-plugin-hybrid-routing"

[project.scripts]
hybrid-routing = "hybrid_routing.cli:main"

[tool.setuptools]
packages = ["hybrid_routing"]

[tool.setuptools.package-data]
hybrid_routing = ["../data/*.yaml"]

